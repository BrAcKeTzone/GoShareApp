<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOSHARE</title>
    <!-- Importing digital/calculator style monospace font -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #f0f6ff;
            --border-sketch: #003366;
            --accent-blue: #0066ff;
            --accent-light: #e6f0ff;
            --text-main: #001122;
            --header-bg: #004acc;
        }

        body { 
            font-family: 'Share Tech Mono', monospace; 
            margin: 0; 
            background: var(--bg-paper); 
            color: var(--text-main); 
            letter-spacing: 0.5px;
        }

        header { 
            background: var(--header-bg); 
            color: #ffffff; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 16px; 
            border-bottom: 3px solid var(--border-sketch);
        }

        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.3rem; }
        .logo-img { width: 36px; height: 36px; border-radius: 8px; border: 2px solid #fff; object-fit: cover; }
        .menu-btn { background: none; border: none; color: #ffffff; font-size: 1.6rem; cursor: pointer; }
        
        .search-container { padding: 12px; background: #fff; border-bottom: 2px solid var(--border-sketch); display: flex; gap: 8px; }
        .search-box { flex: 1; display: flex; align-items: center; background: #fff; border: 2px solid var(--border-sketch); border-radius: 8px; padding: 6px 10px; gap: 8px; }
        .search-box input { border: none; outline: none; width: 100%; font-size: 1.1rem; font-family: inherit; background: transparent; }
        
        .icon-burger-sm { background: #fff; border: 2px solid var(--border-sketch); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: bold; font-family: inherit; }

        .path-bar { background: #003366; color: #fff; padding: 10px 16px; font-size: 1rem; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--border-sketch); }
        
        .file-list { background: #fff; max-height: calc(100vh - 180px); overflow-y: auto; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px dashed #b3d1ff; cursor: pointer; }
        .file-item:hover { background: var(--accent-light); }
        .file-info { display: flex; align-items: center; gap: 12px; }
        .file-size { color: #555; font-size: 0.9rem; }
        
        .download-btn { background: var(--header-bg); color: white; border: 2px solid var(--border-sketch); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; }
        .download-btn:hover { background: #002288; }

        /* High-Contrast Dropdown Menus */
        .dropdown { 
            position: absolute; 
            right: 16px; 
            top: 55px; 
            background: #ffffff; 
            border: 3px solid var(--border-sketch); 
            border-radius: 8px; 
            box-shadow: 4px 4px 0px rgba(0,51,102,0.8); 
            display: none; 
            z-index: 100; 
            width: 180px; 
        }
        .dropdown.open { display: block; }
        .dropdown div { 
            padding: 12px 16px; 
            cursor: pointer; 
            border-bottom: 2px solid #eee; 
            font-size: 1.1rem; 
            font-weight: bold; 
            color: #000000; 
            background: #ffffff;
            font-family: inherit;
        }
        .dropdown div:hover { background: var(--accent-light); color: var(--header-bg); }

        /* Viewer Container (iFrame mode) */
        #viewerContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-paper);
            z-index: 300;
            flex-direction: column;
        }
        .viewer-header {
            background: var(--header-bg);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--border-sketch);
        }
        .btn-back-viewer {
            background: var(--accent-light);
            color: var(--header-bg);
            border: 2px solid var(--border-sketch);
            padding: 6px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0px rgba(0,51,102,0.8);
        }
        .btn-back-viewer:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }
        #fileViewerFrame {
            flex: 1;
            border: none;
            width: 100%;
            background: #ffffff;
        }

        /* Modal Overlay */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,50,0.6); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal { background: #fff; width: 90%; max-width: 400px; border: 3px solid var(--border-sketch); border-radius: 12px; padding: 20px; box-shadow: 6px 6px 0px rgba(0,51,102,0.9); }
        .dropzone { border: 3px dashed var(--border-sketch); border-radius: 12px; padding: 30px 10px; text-align: center; margin: 15px 0; background: var(--accent-light); }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .btn-upload { background: var(--header-bg); color: white; border: 2px solid var(--border-sketch); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; }
        .btn-close { background: #e0e0e0; color: #000; border: 2px solid var(--border-sketch); padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: inherit; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <!-- Using your custom icon image embedded as base64 or linked via api/icon -->
            <img src="/api/icon" class="logo-img" alt="GOSHARE Icon">
            <span>GOSHARE</span>
        </div>
        <button class="menu-btn" onclick="toggleMainMenu()">☰</button>
        <div id="mainMenu" class="dropdown">
            <div onclick="openUploadModal()">📤 Send Files</div>
            <div onclick="showInfo()">ℹ️ Info / About</div>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search file or folder..." oninput="filterFiles()">
        </div>
        <button class="icon-burger-sm" onclick="toggleSubMenu()">☰</button>
        <div id="subMenu" class="dropdown" style="right: 20px; top: 120px;">
            <div onclick="goHome()">🏠 Home</div>
            <div onclick="loadFiles()">🔄 Refresh</div>
            <div onclick="createNewFolderPrompt()">📁 New Folder</div>
        </div>
    </div>

    <div class="path-bar" id="pathBar">
        <span>⬅</span> <span id="currentPath">/</span>
    </div>

    <div class="file-list" id="fileList">
        <!-- Dynamic Content Injected Here -->
    </div>

    <!-- Fullscreen iFrame File Viewer Overlay -->
    <div id="viewerContainer">
        <div class="viewer-header">
            <span id="viewerTitle" style="font-weight: bold; font-size: 1.2rem;">Viewing File</span>
            <button class="btn-back-viewer" onclick="closeViewer()">⬅ Back to App</button>
        </div>
        <iframe id="fileViewerFrame"></iframe>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <h3>Send Files to Current Directory</h3>
            <div class="dropzone">
                <p>Select Files or Drop Here...</p>
                <input type="file" id="fileInput" multiple style="display:none" onchange="handleFileSelect(this.files)">
                <button class="btn-upload" onclick="document.getElementById('fileInput').click()">Browse Files</button>
            </div>
            <p id="uploadLocationText" style="font-size: 0.9rem; color: #333;">Location: /</p>
            <p id="fileStats" style="font-size: 0.95rem; font-weight: bold;">Files Selected: 0 | Total Size: 0 KB</p>
            <div class="modal-buttons">
                <button class="btn-upload" id="uploadSubmitBtn" onclick="uploadFiles()" disabled>Upload Now</button>
                <button class="btn-close" onclick="closeUploadModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        let fileData = [];
        let currentSubPath = "";
        let selectedFilesList = [];

        window.onload = () => { loadFiles(); };

        function toggleMainMenu() { 
            document.getElementById('mainMenu').classList.toggle('open'); 
            document.getElementById('subMenu').classList.remove('open');
        }
        function toggleSubMenu() { 
            document.getElementById('subMenu').classList.toggle('open'); 
            document.getElementById('mainMenu').classList.remove('open');
        }

        function openUploadModal() {
            document.getElementById('uploadModal').style.display = 'flex';
            toggleMainMenu();
        }
        function closeUploadModal() { document.getElementById('uploadModal').style.display = 'none'; }

        function showInfo() {
            alert("GOSHARE v1.2\nDigital-themed local network file sharing tool built with Golang.");
            toggleMainMenu();
        }

        async function loadFiles() {
            const res = await fetch('/api/list?path=' + encodeURIComponent(currentSubPath));
            fileData = await res.json();
            renderFiles(fileData);
            document.getElementById('currentPath').innerText = '/' + currentSubPath;
            document.getElementById('uploadLocationText').innerText = 'Location: /' + currentSubPath;
            document.getElementById('subMenu').classList.remove('open');
        }

        function goHome() {
            currentSubPath = "";
            loadFiles();
        }

        async function createNewFolderPrompt() {
            document.getElementById('subMenu').classList.remove('open');
            const folderName = prompt("Enter new folder name:");
            if (!folderName) return;

            const res = await fetch('/api/mkdir', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: currentSubPath, name: folderName })
            });

            if (res.ok) {
                loadFiles();
            } else {
                alert("Failed to create folder.");
            }
        }

        function renderFiles(items) {
            const listEl = document.getElementById('fileList');
            listEl.innerHTML = '';
            
            if (currentSubPath !== "") {
                const backRow = document.createElement('div');
                backRow.className = 'file-item';
                backRow.innerHTML = `<div class="file-info"><span>🔙</span><strong>.. (Parent Directory)</strong></div>`;
                backRow.onclick = () => {
                    const parts = currentSubPath.split('/').filter(Boolean);
                    parts.pop();
                    currentSubPath = parts.join('/');
                    loadFiles();
                };
                listEl.appendChild(backRow);
            }

            if (!items || items.length === 0) {
                const emptyRow = document.createElement('div');
                emptyRow.className = 'file-item';
                emptyRow.innerHTML = `<div class="file-info"><span>📂</span><span>Directory is empty</span></div>`;
                listEl.appendChild(emptyRow);
                return;
            }

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'file-item';
                row.innerHTML = `
                    <div class="file-info">
                        <span>${item.IsDir ? '📁' : '📄'}</span>
                        <div>
                            <div><strong>${item.Name}</strong></div>
                            <div class="file-size">${item.IsDir ? 'Folder' : formatBytes(item.Size)}</div>
                        </div>
                    </div>
                    ${item.IsDir ? '<span style="font-weight:bold;">➔</span>' : `<button class="download-btn" onclick="event.stopPropagation(); downloadFile('${item.Name}')">Download</button>`}
                `;
                
                row.onclick = () => {
                    if (item.IsDir) {
                        currentSubPath = currentSubPath ? currentSubPath + '/' + item.Name : item.Name;
                        loadFiles();
                    } else {
                        openFileInViewer(item.Name);
                    }
                };
                listEl.appendChild(row);
            });
        }

        function openFileInViewer(filename) {
            const filePath = currentSubPath ? currentSubPath + '/' + filename : filename;
            const viewer = document.getElementById('viewerContainer');
            const frame = document.getElementById('fileViewerFrame');
            const title = document.getElementById('viewerTitle');

            title.innerText = filename;
            frame.src = '/api/view?file=' + encodeURIComponent(filePath);
            viewer.style.display = 'flex';
        }

        function closeViewer() {
            const viewer = document.getElementById('viewerContainer');
            const frame = document.getElementById('fileViewerFrame');
            viewer.style.display = 'none';
            frame.src = 'about:blank';
        }

        function filterFiles() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = fileData.filter(f => f.Name.toLowerCase().includes(query));
            renderFiles(filtered);
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024, dm = decimals < 0 ? 0 : decimals, sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function downloadFile(filename) {
            const filePath = currentSubPath ? currentSubPath + '/' + filename : filename;
            window.location.href = '/api/download?file=' + encodeURIComponent(filePath);
        }

        function handleFileSelect(files) {
            selectedFilesList = files;
            document.getElementById('fileStats').innerText = `Files Selected: ${files.length} | Size: ${formatBytes(Array.from(files).reduce((acc, f) => acc + f.size, 0))}`;
            document.getElementById('uploadSubmitBtn').disabled = files.length === 0;
        }

        async function uploadFiles() {
            const formData = new FormData();
            formData.append('path', currentSubPath);
            for (let file of selectedFilesList) {
                formData.append('files', file);
            }
            await fetch('/api/upload', { method: 'POST', body: formData });
            closeUploadModal();
            loadFiles();
        }
    </script>
</body>
</html>
